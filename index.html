<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>一日七次 · 跟练</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a14">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一日七次">
<style>
:root{--bg:#0a0a14;--card:#12122a;--text:#ccc;--gold:#f0c040;--accent:#e2b04a;--blue:#4a90d9;--green:#4caf84;--dim:#777;--red:#dc503c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#home{display:flex;flex-direction:column;max-width:500px;margin:0 auto;padding:16px 14px 24px;min-height:100vh;min-height:100dvh}
#home h1{color:var(--gold);font-size:1.35em;text-align:center;padding:8px 0 2px;letter-spacing:1px}
#home .sub{color:var(--dim);font-size:0.75em;text-align:center;margin-bottom:10px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:6px 0}
.wp{text-align:center}.wp .wn{font-size:1.9em;font-weight:bold;color:var(--gold);line-height:1.2}
.wp .wl{color:var(--dim);font-size:0.8em;margin-top:2px}.wp .wd{color:var(--green);font-size:0.7em;margin-top:2px}
.weekcal{display:flex;gap:3px;margin:8px 0}
.wcd{flex:1;text-align:center;padding:6px 2px;background:var(--card);border-radius:6px;font-size:0.62em;min-width:0}
.wcd .wce{font-size:0.9em;line-height:1.2}.wcd .wct{font-size:0.65em;color:var(--dim);margin-top:1px}
.wcd.cur{border:2px solid var(--gold);background:rgba(240,192,64,0.08)}
.wcd.dn{background:rgba(76,175,132,0.1);border:1px solid rgba(76,175,132,0.3)}.wcd.dn .wct{color:var(--green)}
.today-box{background:linear-gradient(135deg,#1a1a08,#1a1a14);border:2px solid var(--gold);border-radius:14px;padding:16px;margin:8px 0;text-align:center}
.today-box .tt{font-size:1.2em;font-weight:bold;color:var(--gold);margin:4px 0}
.today-box .ts{font-size:0.7em;color:var(--dim);margin:4px 0 10px;line-height:1.5;word-break:break-all}
.today-box button{display:block;width:100%;padding:15px;background:var(--gold);color:#000;border:none;border-radius:10px;font-size:1.1em;font-weight:bold;cursor:pointer;transition:all 0.2s}
.today-box button:active{transform:scale(0.97);opacity:0.85}
.today-box button.done{background:#2a3a2a;color:var(--green);border:1px solid var(--green)}
.week-adj{display:flex;gap:6px;align-items:center;justify-content:center;margin:4px 0;font-size:0.7em;color:var(--dim)}
.week-adj button{background:var(--card);border:1px solid #333;color:var(--dim);padding:4px 12px;border-radius:5px;font-size:0.85em;cursor:pointer}
#w{display:none;flex-direction:column;max-width:500px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg)}
.wtop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);flex-shrink:0;min-height:44px}
.wtop .wlbl{color:var(--dim);font-size:0.75em}.wtop .wpg{color:var(--dim);font-size:0.7em}
.wtop button{background:none;border:1px solid #444;color:var(--dim);padding:4px 12px;border-radius:6px;font-size:0.8em;cursor:pointer}
.wmain{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 14px;gap:2px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.exname{font-size:1.1em;font-weight:bold;color:var(--gold);text-align:center;margin-top:2px}
.exdetail{font-size:0.7em;color:var(--accent);text-align:center}
/* ---- Animation area ---- */
.anim-box{width:240px;height:150px;margin:2px 0;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.anim-box svg{width:100%;height:100%;overflow:visible}
.anim-box svg line,.anim-box svg circle,.anim-box svg path,.anim-box svg rect,.anim-box svg ellipse{transition:all 0.5s ease}
.anim-box img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block}
/* breathing belly */
@keyframes bellyIn{0%{r:18}100%{r:28}}
@keyframes bellyOut{0%{r:28}100%{r:18}}
@keyframes pcPulse{0%,100%{opacity:0.4;r:5}50%{opacity:1;r:8}}
@keyframes arrowUp{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
@keyframes fadeInOut{0%,100%{opacity:0.2}50%{opacity:1}}
/* ---- ring & timer ---- */
.breath-ring{width:70px;height:70px;border-radius:50%;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;transition:all 0.4s ease;margin:2px 0;flex-shrink:0;position:relative}
.breath-ring.inhale{transform:scale(1.35);border-color:var(--green);box-shadow:0 0 24px rgba(76,175,132,0.3)}
.breath-ring.exhale{transform:scale(0.75);border-color:var(--blue)}
.breath-ring.contract{border-color:var(--accent);animation:contractPulse 0.8s ease-in-out infinite}
.breath-ring.hold{border-color:var(--gold)}
.breath-ring.rest{border-color:var(--dim);animation:restPulse 2s ease-in-out infinite}
.breath-ring.countdown{border-color:var(--gold);animation:cdPulse 1s ease-in-out infinite}
@keyframes contractPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes restPulse{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes cdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.phase-cue{font-size:1.6em;font-weight:bold;color:#fff;letter-spacing:3px;position:absolute}
.phase-timer{font-size:3em;font-weight:bold;color:#fff;line-height:1;font-variant-numeric:tabular-nums;min-height:48px;display:flex;align-items:center}
.phase-timer.green{color:var(--green)}.phase-timer.blue{color:var(--blue)}.phase-timer.gold{color:var(--gold)}.phase-timer.rest-color{color:var(--dim)}
.phase-timer.pulse{animation:timerPulse 0.5s ease-in-out}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rep-info{font-size:0.72em;color:var(--dim);min-height:16px}
.progress-bar{width:100%;max-width:320px;height:3px;background:#222;border-radius:2px;margin:2px 0;flex-shrink:0}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.3s;width:0%}
.steps-box{width:100%;max-width:340px;font-size:0.7em;color:#999;text-align:left;line-height:1.65;background:rgba(0,0,0,0.2);border-radius:8px;padding:8px 12px;flex-shrink:0;max-height:25vh;overflow-y:auto}
.steps-box .st-title{color:var(--dim);font-size:0.82em;font-weight:bold;margin-bottom:3px}
.steps-box ol{padding-left:16px;margin:0}.steps-box li{margin:1px 0}
.steps-box .key{color:var(--gold);font-size:0.95em}
.steps-box .mistake{color:var(--red);margin-top:3px;font-size:0.92em;padding:2px 0}
.steps-box .principle{color:var(--accent);font-size:0.88em;margin-top:3px;border-left:2px solid var(--accent);padding-left:6px}
.steps-box .book-ref{font-size:0.72em;color:var(--dim);margin-top:3px;text-align:right;font-style:italic}
.steps-box img{max-width:100%;border-radius:6px;margin-top:4px;opacity:0.8}
.exlist-toggle{font-size:0.65em;color:var(--dim);background:none;border:1px solid #333;padding:4px 12px;border-radius:5px;cursor:pointer;margin:2px 0;flex-shrink:0}
.exlist{display:none;width:100%;max-width:340px;max-height:22vh;overflow-y:auto;font-size:0.66em;background:rgba(0,0,0,0.25);border-radius:8px;flex-shrink:0}
.exlist .el{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:1px solid rgba(255,255,255,0.04)}
.exlist .el:last-child{border-bottom:none}
.exlist .el .eln{color:var(--dim)}.exlist .el .elr{color:var(--dim);font-size:0.85em}
.exlist .el.cur{background:rgba(240,192,64,0.08)}.exlist .el.cur .eln{color:var(--gold);font-weight:bold}
.exlist .el.dn .eln{color:var(--green)}
.wbot{display:flex;gap:6px;padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);flex-shrink:0}
.wbot button{flex:1;padding:12px;border-radius:10px;border:none;font-size:0.85em;font-weight:bold;cursor:pointer;transition:all 0.15s}
.wbot button:active{transform:scale(0.96)}
.wskip-btn{background:#2a2a2a;color:var(--dim)}.wpause-btn{background:#333;color:var(--text)}.wexit-btn{background:#331313;color:var(--red)}
.wcd{cursor:pointer}
.wcal-hint{font-size:0.66em;color:#666;text-align:center;margin:2px 0 8px}
.pv-mask{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px}
.pv-box{background:#141416;border:1px solid #333;border-radius:14px;width:100%;max-width:540px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.pv-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #222}
.pv-title{font-weight:bold;font-size:0.95em;color:var(--gold)}
.pv-x{background:none;border:none;color:var(--dim);font-size:1.15em;cursor:pointer;padding:6px 12px}
.pv-body{overflow-y:auto;padding:10px 12px}
.pv-item{border:1px solid #26262a;border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--card)}
.pv-nm{font-weight:bold;font-size:0.9em}
.pv-r{color:var(--gold);font-size:0.78em;margin-left:6px}
.pv-d{color:var(--dim);font-size:0.72em;margin:3px 0}
.pv-k{color:#9fd18f;font-size:0.7em;margin-top:4px}
.pv-pass{color:var(--gold);font-size:0.7em;margin-top:4px}
.pv-m{color:var(--red);font-size:0.7em;margin-top:4px}
.pv-detail{margin-top:6px;font-size:0.7em;color:#bbb}
.pv-detail ol{margin:4px 0 0 16px;padding:0}
.pv-detail li{margin:2px 0}
.pv-btn{width:100%;margin:0;padding:13px;background:var(--card);border:none;border-top:1px solid #222;color:var(--text);font-weight:bold;cursor:pointer}/* ============ 单人专项（私密模块） ============ */
.solo-entry{margin:6px 0 2px;padding:0 2px}
.solo-entry button{width:100%;padding:13px;background:var(--card);border:1px solid #3a2a4a;color:#b98ae0;border-radius:10px;font-size:0.9em;font-weight:bold;cursor:pointer;position:relative;overflow:hidden;-webkit-touch-callout:none}
.solo-entry .lp{position:absolute;left:0;top:0;bottom:0;background:rgba(185,138,224,0.35);width:0}
.solo-entry .sh{font-size:0.62em;color:#666;text-align:center;margin-top:3px}
#sv{display:none;flex-direction:column;max-width:500px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg)}
.sv-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);flex-shrink:0;min-height:52px}
.sv-top .t{color:#b98ae0;font-weight:bold;font-size:1em}
.sv-top button{background:#331313;color:var(--red);border:none;border-radius:8px;padding:10px 16px;font-size:0.85em;font-weight:bold;cursor:pointer}
.sv-notice{position:sticky;top:0;z-index:5;background:#151522;border-bottom:1px solid #2a2a3a;padding:8px 12px;font-size:0.66em;color:#9aa;line-height:1.7;flex-shrink:0;max-height:32vh;overflow-y:auto}
.sv-notice b{color:#f0c040}
.sv-tabs{display:flex;gap:4px;padding:8px 10px 0;flex-shrink:0}
.sv-tabs button{flex:1;padding:9px;background:var(--card);border:1px solid #2a2a3a;color:var(--dim);border-radius:8px 8px 0 0;font-size:0.8em;cursor:pointer}
.sv-tabs button.on{color:#000;background:var(--gold);border-color:var(--gold);font-weight:bold}
.sv-main{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.sv-card{background:var(--card);border-radius:12px;padding:12px;margin:6px 0}
.sv-card .t{font-weight:bold;font-size:0.95em;color:var(--gold)}
.sv-card .d{font-size:0.7em;color:var(--dim);margin:3px 0}
.sv-card .bk{font-size:0.66em;color:#9fd18f}
.sv-stage{display:flex;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.75em}
.sv-stage .n{color:var(--text)}
.sv-stage .t2{color:var(--dim);margin-left:auto;white-space:nowrap}
.sv-run{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.sv-ring{width:110px;height:110px;border-radius:50%;border:3px solid #7a5a9a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sv-ring .in{text-align:center}
.sv-ring .t1{font-size:1.7em;font-weight:bold;color:#fff}
.sv-ring .t2{font-size:0.62em;color:var(--dim)}
.sv-cue{font-size:1em;font-weight:bold;color:#b98ae0;text-align:center;min-height:1.4em;padding:0 8px}
.sv-sub{font-size:0.72em;color:var(--accent);text-align:center;min-height:1.2em}
.sv-levels{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:2px 0}
.sv-levels button{width:34px;height:34px;border-radius:8px;border:1px solid #3a3a4a;background:var(--card);color:var(--text);font-size:0.85em;cursor:pointer}
.sv-levels button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:bold}
.sv-lvl-now{font-size:0.7em;color:var(--dim);text-align:center}
.sv-org{width:100%;max-width:340px;padding:16px;background:linear-gradient(135deg,#3a1220,#1a0a14);border:2px solid #d24a6a;color:#ff9db4;border-radius:14px;font-size:1.05em;font-weight:bold;cursor:pointer;transition:all 0.15s}
.sv-org:active{transform:scale(0.97)}
.sv-org .sub{display:block;font-size:0.62em;font-weight:normal;color:#c98;margin-top:2px}
.sv-shot{width:100%;max-width:340px;padding:10px;background:#2a2020;border:1px solid #5a3a3a;color:#c99;border-radius:10px;font-size:0.8em;cursor:pointer}
.sv-count{font-size:0.75em;color:#ff9db4;text-align:center}
.sv-bot{display:flex;gap:6px;padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);flex-shrink:0}
.sv-bot button{flex:1;padding:12px;border-radius:10px;border:none;font-size:0.85em;font-weight:bold;cursor:pointer}
.sv-bot .skip{background:#2a2a2a;color:var(--dim)}
.sv-bot .pause{background:#333;color:var(--text)}
.sv-bot .quit{background:#331313;color:var(--red)}
.sv-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(240,192,64,0.95);color:#000;font-weight:bold;padding:10px 18px;border-radius:20px;font-size:0.85em;z-index:99;display:none;max-width:86vw;text-align:center}
.sv-week{display:flex;gap:3px;margin:4px 0}
.sv-wd{flex:1;text-align:center;padding:5px 2px;background:var(--card);border-radius:6px;font-size:0.6em;color:var(--dim);line-height:1.5}
.sv-wd.on{color:var(--gold);border:1px solid rgba(240,192,64,0.5)}
.sv-wd.cur{border:1px solid #b98ae0}
.sv-log{font-size:0.72em;color:var(--text)}
.sv-log table{width:100%;border-collapse:collapse}
.sv-log td,.sv-log th{border-bottom:1px solid rgba(255,255,255,0.06);padding:4px 2px;text-align:left}
.sv-log th{color:var(--dim);font-weight:normal}
.sv-voice{font-size:0.7em;background:var(--card);border:1px solid #333;color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer}
.sv-d{font-size:0.68em;color:#9aa;padding:2px 10px 8px;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.55}
.sv-d b{color:var(--gold)}
.sv-d b.why{color:#9fd18f}
.sv-how{width:100%;max-width:360px;font-size:0.7em;color:#9aa;background:rgba(0,0,0,0.25);border-radius:8px;padding:8px 10px;line-height:1.6;max-height:24vh;overflow-y:auto;text-align:left}
</style>
</head>
<body>
<div id="home">
  <h1>🔥 一日七次</h1>
  <div class="sub">道家房中术 · 语音跟练 · v2026.08.15</div>
  <div class="wp card"><div class="wn" id="wn">--</div><div class="wl" id="wl">--</div><div class="wd" id="wdone">--</div></div>
  <div class="weekcal" id="wcal"></div>
  <div class="week-adj"><span>调整周数：</span><button onclick="adjWeek(-1)">◀</button><span id="wkov" style="color:var(--gold);min-width:60px;text-align:center">自动</span><button onclick="adjWeek(1)">▶</button></div>
  <div class="wcal-hint">👆 点周一到周日，可查看当天训练计划（查看学习，不记录）</div>
  <div class="today-box"><div class="tt" id="tt">--</div><div class="ts" id="ts">--</div><button id="tbtn" onclick="startWorkout()">🚀 开始今日训练</button></div>
<button id="instbtn" onclick="installApp()" style="display:none;width:100%;margin:4px 0;padding:12px;background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:10px;font-size:0.9em;font-weight:bold;cursor:pointer">📲 安装为离线App</button>
<div style="font-size:0.68em;color:#666;text-align:center;margin:0 0 8px;line-height:1.6">安卓：浏览器菜单 → 添加到主屏幕（支持时点上方按钮）<br>苹果：Safari 分享 → 添加到主屏幕</div>
<div class="solo-entry"><button id="solobtn" onpointerdown="soloPress(event)" onpointerup="soloRelease()" onpointercancel="soloRelease()" onpointerleave="soloRelease()" oncontextmenu="return false"><div class="lp" id="sololp"></div>🔒 单人专项（长按 3 秒解锁）</button><div class="sh">自我取悦 · 六技法 · 大提气 · 后入模拟 · 高潮记录 · 仅存本机</div></div>
<button onclick="checkUpdate()" style="width:100%;margin:4px 0;padding:10px;background:var(--card);border:1px solid #2a2a3a;color:var(--dim);border-radius:10px;font-size:0.8em;cursor:pointer">🔄 检查更新（若显示旧版，点这里）</button>
</div>
<div id="w">
  <div class="wtop"><span class="wlbl" id="wlbl">--</span><span class="wpg" id="wpg">--</span></div>
  <div class="wmain">
    <div class="exname" id="wnm">准备</div>
    <div class="exdetail" id="wdt"></div>
    <div class="anim-box" id="wanim"></div>
    <div class="breath-ring" id="wring"><div class="phase-cue" id="wcue">准备</div></div>
    <div class="phase-timer" id="wtimer">--</div>
    <div class="rep-info" id="wrep"></div>
    <div class="progress-bar"><div class="progress-fill" id="wpf"></div></div>
    <div class="steps-box" id="wsteps"></div>
    <button class="exlist-toggle" onclick="toggleList()">📋 查看全部动作 ▾</button>
    <div class="exlist" id="exlist"></div>
  </div>
  <div class="wbot"><button class="wskip-btn" onclick="skipExercise()">⏭ 跳过</button><button class="wpause-btn" id="wpbtn" onclick="togglePause()">⏸ 暂停</button><button class="wexit-btn" onclick="quitWorkout()">✕ 退出</button></div>
</div>
<script>
"use strict";
// ============ STORAGE ============
function loadState(){try{return JSON.parse(localStorage.getItem("yq8"))||{sd:null,done:{},ov:0}}catch(e){return{sd:null,done:{},ov:0}}}
function saveState(s){try{localStorage.setItem("yq8",JSON.stringify(s))}catch(e){}}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayOfWeek(){var d=new Date().getDay();return d===0?6:d-1}
function calcWeek(){var s=loadState();if(s.ov>0)return s.ov;if(!s.sd)return 1;var diff=Math.floor((new Date()-new Date(s.sd))/(7*86400000))+1;if(diff<1)return 1;if(diff<=2)return 1;if(diff<=4)return 3;if(diff<=6)return 5;if(diff<=10)return 7;if(diff<=16)return 11;return 17}
function adjWeek(d){var s=loadState();if(!s.sd){s.sd=todayStr();saveState(s)}var w=calcWeek();if(s.ov<=0)s.ov=w;s.ov=Math.max(1,s.ov+d);saveState(s);renderHome()}

function svPause(){svPaused=!svPaused;var b=document.getElementById("svpbtn");if(svPaused){if(b)b.textContent="▶ 继续";var t=document.getElementById("svtime");if(t)t.textContent="⏸"}else{if(b)b.textContent="⏸ 暂停";var t2=document.getElementById("svtime");if(t2)t2.textContent=svTimeLeft}}
function svSkip(){if(!svSid)return;svStageI++;svStopTimer();if(svStageI>=SV_LIB[svSid].stages.length){svFinish();return}svLoadStage()}
function quitSolo(){svStopTimer();svDone=true;try{speechSynthesis.cancel()}catch(e){}document.getElementById("sv").style.display="none";document.getElementById("home").style.display="flex";renderHome()}
function openSolo(){svTabOpen="plan";document.getElementById("home").style.display="none";document.getElementById("sv").style.display="flex";svNotices();svRender();svToast("单人专项 · 数据仅存本机")}
function soloPress(ev){if(ev&&ev.preventDefault)ev.preventDefault();svPressT0=Date.now();svPressTimer=setInterval(function(){var p=(Date.now()-svPressT0)/3000*100;var lp=document.getElementById("sololp");if(lp)lp.style.width=Math.min(100,p)+"%";if(Date.now()-svPressT0>=3000){clearInterval(svPressTimer);svPressTimer=null;var lp2=document.getElementById("sololp");if(lp2)lp2.style.width="0";try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}openSolo()}},50)}
function soloRelease(){if(svPressTimer){clearInterval(svPressTimer);svPressTimer=null}var lp=document.getElementById("sololp");if(lp)lp.style.width="0"}
// ============ 检查更新（强制刷新 Service Worker） ============
function checkUpdate(){try{if(!("serviceWorker" in navigator)){alert("此浏览器无离线缓存，直接刷新即可");location.reload();return}navigator.serviceWorker.getRegistration().then(function(r){if(!r){alert("未启用离线缓存，刷新页面即可");location.reload();return}function restart(){setTimeout(function(){location.reload(true)},500)}if(r.waiting){r.waiting.postMessage({type:"SKIP_WAITING"});alert("已更新，正在重启");restart();return}if(r.installing){alert("正在后台更新，稍等几秒再刷新");return}r.update().then(function(){setTimeout(function(){if(r.waiting){r.waiting.postMessage({type:"SKIP_WAITING"});alert("已更新，正在重启");restart()}else alert("已是最新版")},800)}).catch(function(){alert("检查失败，请手动清缓存")})}).catch(function(){alert("检查失败，请手动清缓存")})}catch(e){alert("检查失败，请手动清缓存")}}
window.addEventListener("load",function(){if("serviceWorker" in navigator&&navigator.onLine){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update().catch(function(){})})}});// ============ INIT ============
initVoices();
document.addEventListener("touchstart",function(){if(gTTS&&!gVoice)initVoices()},{once:true});
document.addEventListener("click",function(){if(gTTS){try{var u=new SpeechSynthesisUtterance("");u.volume=0;speechSynthesis.speak(u)}catch(e){}}},{once:true});
renderHome();
